name: Check

on:
  push:
    branches: [main, init]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.21.0'
  HARNESS_REVISION: aa8262ec091698bae9a6b04773a6b5b06ad4aef2
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_REVISION }}
          path: .harness
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pnpm in runner-local directory
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpm" --ignore-scripts --no-audit "pnpm@$PNPM_VERSION"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build pinned harness host packages
        run: |
          pnpm --dir .harness install --frozen-lockfile
          pnpm --dir .harness run build:lib:host
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify plugin
        run: pnpm run check
      - name: Audit plugin dependencies
        run: pnpm audit --audit-level high
